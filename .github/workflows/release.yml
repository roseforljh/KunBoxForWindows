name: Build and Release

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: 'patch'
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get latest version
        id: get_version
        shell: bash
        run: |
          # 获取最新的 tag 版本号
          latestTag=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          version=${latestTag#v}
          echo "Latest version: $version"
          echo "current_version=$version" >> $GITHUB_OUTPUT

      - name: Calculate new version
        id: new_version
        shell: bash
        run: |
          current="${{ steps.get_version.outputs.current_version }}"
          IFS='.' read -r major minor patch <<< "$current"

          case "${{ github.event.inputs.version_type }}" in
            major)
              major=$((major + 1))
              minor=0
              patch=0
              ;;
            minor)
              minor=$((minor + 1))
              patch=0
              ;;
            patch)
              patch=$((patch + 1))
              ;;
          esac

          newVersion="$major.$minor.$patch"
          echo "New version: $newVersion"
          echo "version=$newVersion" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: kunbox-electron/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri CLI
        run: cargo install tauri-cli

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        working-directory: kunbox-electron
        run: npm ci

      - name: Run frontend lint
        working-directory: kunbox-electron
        run: npm run lint

      - name: Run frontend typecheck
        working-directory: kunbox-electron
        run: npm run typecheck

      - name: Build frontend
        working-directory: kunbox-electron
        run: npm run build

      - name: Download sing-box kernel
        shell: pwsh
        run: |
          $apiUrl = "https://api.github.com/repos/SagerNet/sing-box/releases/latest"
          $headers = @{ "Accept" = "application/vnd.github.v3+json"; "User-Agent" = "KunBox-CI" }
          $release = Invoke-RestMethod -Uri $apiUrl -Headers $headers
          $tag = $release.tag_name
          $version = $tag.TrimStart('v')
          $assetName = "sing-box-$version-windows-amd64.zip"
          $asset = $release.assets | Where-Object { $_.name -eq $assetName }
          if (-not $asset) { throw "Asset $assetName not found in release $tag" }
          $downloadUrl = $asset.browser_download_url
          Write-Host "Downloading sing-box $version from $downloadUrl"
          $zipPath = "src-tauri/resources/libs/sing-box.zip"
          Invoke-WebRequest -Uri $downloadUrl -OutFile $zipPath -UseBasicParsing
          Expand-Archive -Path $zipPath -DestinationPath "src-tauri/resources/libs/temp" -Force
          $exe = Get-ChildItem -Path "src-tauri/resources/libs/temp" -Recurse -Filter "sing-box.exe" | Select-Object -First 1
          if (-not $exe) { throw "sing-box.exe not found in archive" }
          Copy-Item $exe.FullName "src-tauri/resources/libs/sing-box.exe"
          $cronet = Get-ChildItem -Path "src-tauri/resources/libs/temp" -Recurse -Filter "libcronet.dll" | Select-Object -First 1
          if ($cronet) {
            Copy-Item $cronet.FullName "src-tauri/resources/libs/libcronet.dll"
          } else {
            Write-Warning "libcronet.dll not found in archive; naive outbound will be unavailable in bundled kernel"
          }
          Remove-Item $zipPath -Force
          Remove-Item "src-tauri/resources/libs/temp" -Recurse -Force
          Write-Host "sing-box $version bundled successfully"

      - name: Run Rust checks
        working-directory: src-tauri
        run: cargo check

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test

      - name: Update version in config files
        shell: pwsh
        run: |
          $newVersion = "${{ steps.new_version.outputs.version }}"

          # Update tauri.conf.json
          $tauriConfig = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $tauriConfig.version = $newVersion
          $tauriConfig | ConvertTo-Json -Depth 10 | Set-Content src-tauri/tauri.conf.json -Encoding UTF8

          # Update package.json
          $packageJson = Get-Content kunbox-electron/package.json -Raw | ConvertFrom-Json
          $packageJson.version = $newVersion
          $packageJson | ConvertTo-Json -Depth 10 | Set-Content kunbox-electron/package.json -Encoding UTF8

          # Update Cargo.toml (only package version, not rust-version)
          $cargoContent = Get-Content src-tauri/Cargo.toml -Raw
          $cargoContent = $cargoContent -replace '(?m)^version = "[0-9]+\.[0-9]+\.[0-9]+"', "version = `"$newVersion`""
          Set-Content src-tauri/Cargo.toml -Value $cargoContent -Encoding UTF8

      - name: Build Tauri app
        working-directory: src-tauri
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: cargo tauri build

      - name: Generate updater manifest (latest.json)
        shell: pwsh
        run: |
          $version = "${{ steps.new_version.outputs.version }}"
          $baseUrl = "https://github.com/${{ github.repository }}/releases/download/v$version"

          $nsisExe = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          $nsisSig = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis/*.exe.sig" | Select-Object -First 1
          $msi = Get-ChildItem -Path "src-tauri/target/release/bundle/msi/*.msi" | Select-Object -First 1
          $msiSig = Get-ChildItem -Path "src-tauri/target/release/bundle/msi/*.msi.sig" | Select-Object -First 1

          if (-not $nsisExe -or -not $nsisSig -or -not $msi -or -not $msiSig) {
            throw "Missing installer or signature files for updater manifest"
          }

          $nsisSignature = (Get-Content $nsisSig.FullName -Raw).Trim()
          $msiSignature = (Get-Content $msiSig.FullName -Raw).Trim()

          $manifest = [ordered]@{
            version  = $version
            notes    = "KunBox v$version"
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = $nsisSignature
                url       = "$baseUrl/$($nsisExe.Name)"
              }
              "windows-x86_64-nsis" = [ordered]@{
                signature = $nsisSignature
                url       = "$baseUrl/$($nsisExe.Name)"
              }
              "windows-x86_64-msi" = [ordered]@{
                signature = $msiSignature
                url       = "$baseUrl/$($msi.Name)"
              }
            }
          }

          $manifest | ConvertTo-Json -Depth 10 | Set-Content "src-tauri/target/release/bundle/latest.json" -Encoding UTF8

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.new_version.outputs.version }}
          name: KunBox v${{ steps.new_version.outputs.version }}
          prerelease: ${{ github.event.inputs.prerelease }}
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/*.msi.sig
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
            src-tauri/target/release/bundle/latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
