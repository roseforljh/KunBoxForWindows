name: Build and Release

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: 'patch'
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get latest version
        id: get_version
        shell: pwsh
        run: |
          # 获取最新的 tag 版本号
          try {
            $latestTag = git describe --tags --abbrev=0 2>$null
          } catch {
            $latestTag = $null
          }
          if (-not $latestTag) {
            $latestTag = "v0.0.0"
          }
          $version = $latestTag -replace '^v', ''
          Write-Host "Latest version: $version"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "current_version=$version"

      - name: Calculate new version
        id: new_version
        shell: pwsh
        run: |
          $current = "${{ steps.get_version.outputs.current_version }}"
          $parts = $current.Split('.')

          $major = [int]$parts[0]
          $minor = [int]$parts[1]
          $patch = [int]$parts[2]

          switch ("${{ github.event.inputs.version_type }}") {
            "major" {
              $major++
              $minor = 0
              $patch = 0
            }
            "minor" {
              $minor++
              $patch = 0
            }
            "patch" {
              $patch++
            }
          }

          $newVersion = "$major.$minor.$patch"
          Write-Host "New version: $newVersion"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$newVersion"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: kunbox-electron/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        working-directory: kunbox-electron
        run: npm ci

      - name: Build frontend
        working-directory: kunbox-electron
        run: npm run build

      - name: Update version in config files
        shell: pwsh
        run: |
          $newVersion = "${{ steps.new_version.outputs.version }}"

          # Update tauri.conf.json
          $tauriConfig = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $tauriConfig.version = $newVersion
          $tauriConfig | ConvertTo-Json -Depth 10 | Set-Content src-tauri/tauri.conf.json -Encoding UTF8

          # Update package.json
          $packageJson = Get-Content kunbox-electron/package.json -Raw | ConvertFrom-Json
          $packageJson.version = $newVersion
          $packageJson | ConvertTo-Json -Depth 10 | Set-Content kunbox-electron/package.json -Encoding UTF8

          # Update Cargo.toml
          $cargoContent = Get-Content src-tauri/Cargo.toml -Raw
          $cargoContent = $cargoContent -replace 'version = "[0-9]+\.[0-9]+\.[0-9]+"', "version = `"$newVersion`""
          Set-Content src-tauri/Cargo.toml -Value $cargoContent -Encoding UTF8

      - name: Build Tauri app
        working-directory: src-tauri
        run: cargo tauri build

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.new_version.outputs.version }}
          name: KunBox v${{ steps.new_version.outputs.version }}
          prerelease: ${{ github.event.inputs.prerelease }}
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
