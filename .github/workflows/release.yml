name: Build and Release

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: 'patch'
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get latest version
        id: get_version
        shell: bash
        run: |
          # 获取最新的 tag 版本号
          latestTag=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          version=${latestTag#v}
          echo "Latest version: $version"
          echo "current_version=$version" >> $GITHUB_OUTPUT

      - name: Calculate new version
        id: new_version
        shell: bash
        run: |
          current="${{ steps.get_version.outputs.current_version }}"
          IFS='.' read -r major minor patch <<< "$current"

          case "${{ github.event.inputs.version_type }}" in
            major)
              major=$((major + 1))
              minor=0
              patch=0
              ;;
            minor)
              minor=$((minor + 1))
              patch=0
              ;;
            patch)
              patch=$((patch + 1))
              ;;
          esac

          newVersion="$major.$minor.$patch"
          echo "New version: $newVersion"
          echo "version=$newVersion" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: kunbox-electron/package-lock.json

      - name: Install dependencies
        working-directory: kunbox-electron
        run: npm ci

      - name: Run lint
        working-directory: kunbox-electron
        run: npm run lint

      - name: Run typecheck
        working-directory: kunbox-electron
        run: npm run typecheck

      - name: Download pinned RayBox kernel
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RAYBOX_READ_TOKEN || github.token }}
        run: ./scripts/fetch-raybox.ps1

      - name: Update version in package.json
        shell: pwsh
        run: |
          $newVersion = "${{ steps.new_version.outputs.version }}"
          $packageJson = Get-Content kunbox-electron/package.json -Raw | ConvertFrom-Json
          $packageJson.version = $newVersion
          $packageJson | ConvertTo-Json -Depth 10 | Set-Content kunbox-electron/package.json -Encoding UTF8

      - name: Build Electron app (Installer & Portable)
        working-directory: kunbox-electron
        run: npm run build:win

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.new_version.outputs.version }}
          name: KunBox v${{ steps.new_version.outputs.version }}
          prerelease: ${{ github.event.inputs.prerelease }}
          generate_release_notes: true
          files: |
            kunbox-electron/dist/*.exe
            kunbox-electron/dist/*.blockmap
            kunbox-electron/dist/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
